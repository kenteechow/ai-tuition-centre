<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}</style>
</head>
<body>
<title>AI 重構補習社</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 補習社「功課簿」— 方格紙底、紅筆批改做重點、印章做崗位標記；左邊崗位網格，右邊校長控制台 */
:root{
  --paper:#eef1f5; --sheet:#ffffff; --sheet-2:#f6f8fb;
  --ink:#18212f; --ink-2:#4d5a6c; --ink-3:#8692a3; --line:#d6dce5;
  --grid:rgba(40,70,120,.07);
  --red:#cf3027; --red-soft:rgba(207,48,39,.10);
  --hl:#f4d03f; --hl-soft:rgba(244,208,63,.35);
  --ok:#23845a; --ok-soft:rgba(35,132,90,.12);
  --warn:#b97806; --warn-soft:rgba(185,120,6,.13);
  --blue:#2c5aa0; --blue-soft:rgba(44,90,160,.10);
  --shadow:0 1px 0 rgba(24,33,47,.05),0 6px 18px -10px rgba(24,33,47,.25);
  --sky1:#dcefff; --sky2:#fdeef4;
  --f-hand:"LXGW WenKai TC","Kaiti TC","STKaiti","KaiTi",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-seal:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --sheet:#171e28; --sheet-2:#1c2430;
  --ink:#e7ebf1; --ink-2:#a3aebd; --ink-3:#6d798a; --line:#2b3544;
  --grid:rgba(140,170,220,.05);
  --red:#ff6a5c; --red-soft:rgba(255,106,92,.14);
  --hl:#e9c84a; --hl-soft:rgba(233,200,74,.22);
  --ok:#4fc58e; --ok-soft:rgba(79,197,142,.14);
  --warn:#e5a83c; --warn-soft:rgba(229,168,60,.15);
  --blue:#7aa7ea; --blue-soft:rgba(122,167,234,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
  --sky1:#1b2642; --sky2:#2b2340;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0f141b; --sheet:#171e28; --sheet-2:#1c2430;
  --ink:#e7ebf1; --ink-2:#a3aebd; --ink-3:#6d798a; --line:#2b3544;
  --grid:rgba(140,170,220,.05);
  --red:#ff6a5c; --red-soft:rgba(255,106,92,.14);
  --hl:#e9c84a; --hl-soft:rgba(233,200,74,.22);
  --ok:#4fc58e; --ok-soft:rgba(79,197,142,.14);
  --warn:#e5a83c; --warn-soft:rgba(229,168,60,.15);
  --blue:#7aa7ea; --blue-soft:rgba(122,167,234,.14);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px -12px rgba(0,0,0,.7);
  --sky1:#1b2642; --sky2:#2b2340;
  color-scheme:dark;}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top */
.top{padding-block:18px 10px;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand h1{font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:.02em}
.brand .sub{color:var(--ink-2);font-size:13px}
.seal{display:inline-grid;place-items:center;width:30px;height:30px;flex:none;border:2px solid var(--red);color:var(--red);
  font-family:var(--f-seal);font-weight:900;font-size:17px;line-height:1;border-radius:4px;transform:rotate(-3deg);background:var(--red-soft)}
.seal.big{width:46px;height:46px;font-size:27px;border-width:2.5px}
.seal.ink{border-color:var(--ink-2);color:var(--ink-2);background:transparent}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:6px 12px;min-width:104px}
.kpi .k{font-size:11px;color:var(--ink-3);letter-spacing:.06em}
.kpi .v{font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v.neg{color:var(--red)} .kpi .v.pos{color:var(--ok)}
.kpi .d{font-size:11px;font-family:var(--f-num)}
.repbar{height:4px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.repbar i{display:block;height:100%;background:var(--ink)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-block:6px 16px;overflow-x:auto}
.cm{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:5px 6px 6px;min-width:58px;position:relative}
.cm .mn{font-weight:700;font-size:13px}
.cm .nt{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.cm .wk{display:flex;gap:3px;margin-top:4px}
.cm .wk i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.cm.past{opacity:.55}
.cm .wk i.done{background:var(--ink-2)}
.cm .wk i.now{background:var(--red)}
.cm.cur{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
.cm.cur .mn{color:var(--red)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start;padding-bottom:40px}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:10px}
.sec-head h2{font-family:var(--f-hand);font-size:22px;margin:0}
.sec-head p{margin:0;color:var(--ink-2);font-size:13px;max-width:60ch}

/* hours map */
.hmap{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;display:grid;gap:12px}
.hrow .hl{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;flex-wrap:wrap}
.hrow .hl b{font-weight:700}
.hbar{position:relative;height:26px;background:var(--sheet-2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.hseg{position:absolute;top:0;bottom:0;display:grid;place-items:center;font-family:var(--f-seal);font-weight:900;font-size:12px;color:var(--sheet);overflow:hidden;border-right:1px solid var(--sheet)}
.hseg.over{background:repeating-linear-gradient(45deg,var(--red) 0 5px,var(--red-soft) 5px 9px)!important;color:var(--sheet)}
.hcap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--red)}
.hcap::after{content:attr(data-l);position:absolute;top:-1px;left:5px;font-size:10px;color:var(--red);white-space:nowrap;font-family:var(--f-num)}
.hnote{font-size:12px;color:var(--ink-2)}

/* dept grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:13px 14px 12px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);min-width:0}
.card.bad{border-color:var(--red)}
.ch{display:flex;gap:10px;align-items:flex-start}
.ch h3{margin:0;font-size:15.5px;font-weight:700}
.ch p{margin:1px 0 0;font-size:12px;color:var(--ink-2)}
.ch .who{margin-left:auto;font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.lv{font-size:10.5px;text-align:center;padding:3px 0;border-radius:4px;background:var(--sheet-2);color:var(--ink-3);border:1px solid var(--line);white-space:nowrap}
.lv.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.lv.tg{background:var(--hl-soft);color:var(--ink);border-color:var(--hl);border-style:dashed}
.ful{display:grid;gap:4px}
.ful .row{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.ful .bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.ful .bar i{display:block;height:100%;border-radius:4px}
.cf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:auto}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--ink)}
.pill{font-size:11px;border-radius:10px;padding:1px 8px;display:inline-block;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.info{background:var(--blue-soft);color:var(--blue)}
.pill.hl{background:var(--hl-soft);color:var(--ink)}

/* side */
.side{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:980px){.side{position:static}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.panel h4{margin:0 0 9px;font-size:13px;letter-spacing:.06em;color:var(--ink-2);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.play{width:100%;padding:13px;font-size:16px;font-weight:700;border-radius:9px;justify-content:center;font-family:var(--f-hand);letter-spacing:.06em}
.wkline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.wkline .big{font-family:var(--f-hand);font-size:24px;font-weight:700}
.staff{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.srow .nm{font-size:13.5px;font-weight:500}
.srow .nm small{display:block;color:var(--ink-3);font-weight:400;font-size:11.5px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.step button{border:0;background:var(--sheet-2);width:30px;height:30px;font-size:16px}
.step button:hover{background:var(--line)}
.step span{min-width:30px;text-align:center;font-family:var(--f-num);font-weight:600}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--sheet);padding:6px 4px;font-size:12px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--sheet)}
.cost{display:grid;gap:3px;font-size:12.5px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line)}
.cost div{display:flex;justify-content:space-between}
.cost .tt{font-weight:700;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:12.5px}
.res div span{display:block;color:var(--ink-3);font-size:11px}
.res b{font-family:var(--f-num);font-weight:600;font-size:15px}
.log{display:grid;gap:6px;max-height:260px;overflow:auto;font-size:12.5px;padding-right:4px}
.log div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline}
.log time{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3)}
.log .ok{color:var(--ok)} .log .bad{color:var(--red)} .log .ai{color:var(--blue)}
.spark{width:100%;height:46px;display:block}

/* modal */
.mw{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--sheet);color:var(--ink);border-radius:12px;max-width:720px;width:100%;max-height:100%;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);border:1px solid var(--line)}
.modal.wide{max-width:920px}
.modal h2{font-family:var(--f-hand);font-size:26px;margin:4px 0 8px;line-height:1.2;text-wrap:balance}
.modal h3{font-size:14px;margin:16px 0 8px}
.modal p{margin:0 0 10px}
.mtag{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chat{background:var(--sheet-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0 12px;display:grid;gap:3px;max-width:520px}
.chat .from{font-size:11.5px;color:var(--ink-3);display:flex;justify-content:space-between;gap:10px}
.chat .bub{font-size:14px;white-space:pre-line}
.choices{display:grid;gap:8px;margin-top:12px}
.choice{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:10px 12px;display:grid;gap:2px}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--sheet-2)}
.choice b{font-size:14px}
.choice small{color:var(--ink-2);font-size:12px}
.tl{display:grid;gap:0;margin:10px 0;border-left:2px solid var(--blue);padding-left:14px}
.tl div{position:relative;padding:4px 0;font-size:13.5px}
.tl div::before{content:"";position:absolute;left:-19px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.tl time{font-family:var(--f-num);font-size:11.5px;color:var(--blue);margin-right:8px}
.aibox{background:var(--blue-soft);border-radius:9px;padding:10px 12px;margin:10px 0}
.aibox .h{font-weight:700;color:var(--blue);font-size:13px;margin-bottom:2px}
.outcome{border-left:3px solid var(--ink);padding:6px 12px;margin:12px 0;background:var(--sheet-2);border-radius:0 8px 8px 0}
.lesson{border:1.5px dashed var(--red);border-radius:9px;padding:10px 12px;margin:12px 0;position:relative}
.lesson .h{font-family:var(--f-hand);color:var(--red);font-size:16px;font-weight:700;margin-bottom:2px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}

/* workflow */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 12px;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;color:var(--ink-2)}
.tabs button.on{border-bottom-color:var(--red);color:var(--ink);font-weight:700}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:6px 0 12px}
.node{border-radius:8px;padding:7px 10px;font-size:12.5px;border:1px solid var(--line);background:var(--sheet-2);max-width:200px;display:grid;gap:1px}
.node em{font-style:normal;font-size:10px;letter-spacing:.08em;color:var(--ink-3)}
.node.in{border-color:var(--ink-2)}
.node.ai{background:var(--blue-soft);border-color:var(--blue)}
.node.ai em{color:var(--blue)}
.node.hu{background:var(--hl-soft);border-color:var(--hl)}
.node.hu em{color:var(--warn)}
.node.out{background:var(--ok-soft);border-color:var(--ok)}
.node.out em{color:var(--ok)}
.arr{align-self:center;color:var(--ink-3);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:5px}
.tools span{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 8px;background:var(--sheet-2)}
.steps{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13.5px}
.wfmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:14px}
.wfmeta div{background:var(--sheet-2);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink-2)}
.wfmeta b{display:block;font-family:var(--f-num);font-size:15px;color:var(--ink)}
.guard{background:var(--hl-soft);border-radius:8px;padding:8px 12px;font-size:13px;margin:10px 0}

/* start */
.scens{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.scen{text-align:left;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:12px 13px;display:grid;gap:6px;align-content:start}
.scen:hover{border-color:var(--ink)}
.scen h3{margin:0;font-size:16px}
.scen .pl{font-size:11.5px;color:var(--ink-3)}
.scen p{margin:0;font-size:12.5px;color:var(--ink-2)}
.scen .st{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px;margin-top:4px}
.scen .st span{color:var(--ink-3)}
.diff{font-family:var(--f-hand);color:var(--red);font-size:14px}
.intro{font-size:14px;color:var(--ink-2);max-width:62ch}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:12px 0 4px}
.rules div{font-size:12.5px;background:var(--sheet-2);border-radius:8px;padding:8px 10px}
.rules b{display:block;font-size:13px;margin-bottom:2px}

/* year end */
.grade{width:92px;height:92px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;color:var(--red);
  font-family:var(--f-hand);font-size:50px;font-weight:700;transform:rotate(-8deg);flex:none}
.ye{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ystats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:14px 0}
.ystats div{background:var(--sheet-2);border-radius:8px;padding:9px 11px;font-size:12px;color:var(--ink-2)}
.ystats b{display:block;font-family:var(--f-num);font-size:18px;color:var(--ink)}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:11.5px;color:var(--ink-3);font-weight:500}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:9px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.foot{color:var(--ink-3);font-size:11.5px;padding-bottom:24px}
@media (prefers-reduced-motion:no-preference){
  .card,.kpi .v{transition:border-color .2s}
  .modal{animation:pop .18s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
}
@media (max-width:520px){.brand h1{font-size:23px}.kpi{min-width:0;flex:1 1 30%}.modal{padding:16px}}

/* 3D view */
.v3{position:relative;height:clamp(320px,46vw,480px);border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;background:linear-gradient(180deg,var(--sky1),var(--sky2))}
.v3.off{height:auto;min-height:52px}
.v3.off .v3canvas,.v3.off .v3labels,.v3.off .leg{display:none}
.v3canvas{position:absolute;inset:0}
.v3canvas canvas{display:block;width:100%!important;height:100%!important}
.v3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

function spark(){

   <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="現金同學生走勢"><path d="${line(c,cmin,cmax)}" fill="none" stroke="var(--ink)" stroke-width="1.6" vector-effect="non-scaling-stroke"/><path d="${line(st,smin,smax)}" fill="none" stroke="var(--red)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;

function vaultInit(){if(s.vault==null)s.vault=Math.max(0,VAULT0-50000*((s.flags&&s.flags.ownIn)||0));if(!s.bossPay)s.bossPay=[];s.tot.bonus=s.tot.bonus||0}

  log(auto?`現金唔夠，自動由校長小金庫補 ${fmt(amt)} 入補習社（小金庫仲有 ${fmt(s.vault)}）`:`校長由小金庫拎 ${fmt(amt)} 入補習社周轉（小金庫仲有 ${fmt(s.vault)}）`,auto?'bad':'');if(!auto){save();render()}return amt}

function bossSettle(){vaultInit();const k=Math.floor(s.t/4)-1;if(k<0||!s.ledger||!s.ledger[k])return;const L=s.ledger[k];if(L.bossDone)return;L.bossDone=1;
  const base=L.boss||0;if(base<=0)return;const r=ledgerSum(k);
  const P=Math.round((r.inc-(L.loanIn||0)-(L.ownIn||0)-(L.vaultIn||0))-(r.out-base-(L.bossBonus||0)));
  let sal=base,bonus=0,held=0;const mn=MONTHS[k%12];
  if(P>=base){bonus=Math.round(.5*(P-base));const cap=Math.max(0,Math.round(s.cash-monthlyCost().total*.5));if(bonus>cap){held=bonus-cap;bonus=cap}
    if(bonus>0){s.cash-=bonus;s.vault+=bonus;s.tot.bonus+=bonus;L.bossBonus=(L.bossBonus||0)+bonus;bossHit(Math.min(8,2+bonus/8000),'分紅')}
    log(`${mn}結算：未計校長人工賺 ${fmt(P)}。校長人工 ${fmt(Math.round(sal))}${bonus?`，多出嚟嘅一半 ${fmt(bonus)} 入小金庫（而家 ${fmt(s.vault)}）`:''}${held?`；為咗留夠半個月開支，有 ${fmt(held)} 分紅冇拎`:''}`,'ok')}
  else{sal=Math.round(base*Math.max(.7,P/base));const back=Math.round(base-sal);if(back>0){s.cash+=back;L.boss=sal;bossHit(-Math.min(8,2+back/1500),'減薪')}
    log(`${mn}結算：未計校長人工${P<0?'蝕 '+fmt(-P):'只賺 '+fmt(P)}，校長減薪 ${Math.round(back/base*100)}%，人工 ${fmt(sal)}（最多減 30%）`,'bad')}
  s.bossPay.unshift({k,P,sal:Math.round(sal),bonus,base:Math.round(base)});s.bossPay=s.bossPay.slice(0,24)}

  if(kind==='own'){s.cash+=amt;book('ownIn',amt);s.capital=(s.capital||0)+amt;s.flags.ownIn=(s.flags.ownIn||0)+1;log(`校長自己拎 ${fmt(amt)} 出嚟周轉`,'');save();render();return}
  const pay=Math.round(loanPay(amt,L.rate,L.months));s.loanId=(s.loanId||0)+1;
  const ln={id:s.loanId,kind,name:L.name,amt,left:amt,rate:L.rate,pay,weeks:L.months*4,t0:s.t};

function spreadPen(k){return grpSpread(k.c,k.g)*.06*(lv('mat')>=2?.5:1)}

function progWeek(){s.classes.forEach(k=>{if(!k.n)return;const G=s.courses[k.c].g[k.g];const dq=.35+(classQ(k)-.7)*4+aiProg()-spreadPen(k)*4;G.prog=(G.prog||0)+dq/Math.max(1,G.cls)})}

function examResults(name){let tot=0,n=0;const good=[],bad=[];
  for(const id in s.courses){const c=s.courses[id];if(!c.on||CMAP[id].grp==='int')continue;for(const k in c.g){const G=c.g[k];if(!G.E)continue;const p=Math.round(G.prog||0);tot+=p*G.E;n+=G.E;(p>=0?good:bad).push([GNAME[id+'.'+k],p,G.E]);
    if(p<-2){const q=Math.max(1,Math.round(G.E*.08));G.E=Math.max(0,G.E-q);syncE(c);s.tot.lost+=q}G.prog=(G.prog||0)*.3}}
  if(!n)return;const avg=tot/n;calcS();
  s.rep=clamp(s.rep+clamp(avg*.25,-3,3),0,100);if(avg>1)addMod('enq',1+Math.min(.25,avg*.03),3);
  good.sort((a,b)=>b[1]-a[1]);bad.sort((a,b)=>a[1]-b[1]);s.lastExam={name,t:s.t,avg,good:good.slice(0,3),bad:bad.slice(0,3)};
  log(`${name}出成績：學生平均${avg>=0?'進步 '+avg.toFixed(1):'退步 '+(-avg).toFixed(1)} 分。${good[0]?`最好「${good[0][0]}」+${good[0][1]}`:''}${bad[0]&&bad[0][1]<0?`；最差「${bad[0][0]}」${bad[0][1]}（有家長停補）`:''}`,avg>=0?'ok':'bad');
  if(avg>1.5&&Math.random()<.7){s.fb.unshift({t:s.t,d:s.day,who:pick(['陳太','黃太','何爸爸','周媽媽']),text:pick([`${good[0][0]}個仔今次考試升咗十幾分，多謝老師！`,'錯題本真係有用，今次考試冇再錯同類題目。']),tone:1,tag:'成績'});s.fbN=(s.fbN||0)+1}}

  const wp=new THREE.Vector3(),wq=new THREE.Quaternion(),ws=new THREE.Vector3(),n=new THREE.Vector3();
  for(const s of W3.signMeshes){if(!s.parent)continue;s.matrixWorld.decompose(wp,wq,ws);if(wp.y>9||Math.abs(wp.x)>60||Math.abs(wp.z)>60)continue;n.set(0,0,1).applyQuaternion(wq);n.y=0;if(n.lengthSq()<.01)continue;n.normalize();
    const par=s.geometry.parameters,wd=par.width*ws.x*.9,len=Math.min(6,2+wp.y*.7),tx=s.material.map.clone();tx.needsUpdate=true;tx.repeat.set(1,-1);tx.offset.set(0,1);

    const grp=new THREE.Group();grp.position.set(wp.x+n.x*.3,-.56,wp.z+n.z*.3);grp.rotation.y=Math.atan2(n.x,n.z);const pl=new THREE.Mesh(new THREE.PlaneGeometry(wd,len),m);pl.rotation.x=-Math.PI/2;pl.position.z=len/2;pl.renderOrder=3;grp.add(pl);g.add(grp);W3.refl.push(m)}}

function initDynLights(sc){const D=W3.dynL={lamps:[],cars:[],signs:[],t:0};
  for(let i=0;i<15;i++){const L=new THREE.PointLight(0xffd9a0,0,9,1.6);L.position.set(0,-50,0);sc.add(L);D.lamps.push(L)}
  for(let i=0;i<4;i++){const L=new THREE.SpotLight(0xfff4d6,0,16,.55,.6,1.4);L.position.set(0,-50,0);sc.add(L);sc.add(L.target);D.cars.push(L)}
  for(let i=0;i<5;i++){const L=new THREE.PointLight(0xffffff,0,6,1.8);L.position.set(0,-50,0);sc.add(L);D.signs.push(L)}}
function signLightList(){if(W3.signPos)return W3.signPos;W3.signPos=[];if(!W3.signMeshes)return W3.signPos;W3.scene.updateMatrixWorld(true);const wp=new THREE.Vector3(),wq=new THREE.Quaternion(),ws=new THREE.Vector3(),n=new THREE.Vector3();
  for(const s of W3.signMeshes){if(!s.parent)continue;s.matrixWorld.decompose(wp,wq,ws);if(wp.y>12)continue;n.set(0,0,1).applyQuaternion(wq);const c=new THREE.Color(s.userData.lc||'#ffe6c8');W3.signPos.push({x:wp.x+n.x*.7,y:wp.y-.2,z:wp.z+n.z*.7,c})}return W3.signPos}
function dynLightsUpdate(dt,night){const D=W3.dynL;if(!D)return;D.t-=dt;const on=night>.02;
  if(D.t<=0){D.t=.25;const tx=CAM.tx,tz=CAM.tz,d2=(x,z)=>(x-tx)*(x-tx)+(z-tz)*(z-tz);
    const lp=(W3.lampPos||[]).slice().sort((a,b)=>d2(a[0],a[2])-d2(b[0],b[2]));D.lamps.forEach((L,i)=>{const p=lp[i];if(p&&on)L.position.set(p[0],p[1],p[2]);else L.position.set(0,-50,0)});
    D.carList=TR.cars.filter(c=>Math.abs(c.p)<80).sort((a,b)=>d2(a.o.position.x,a.o.position.z)-d2(b.o.position.x,b.o.position.z)).slice(0,D.cars.length);
    const sp=signLightList().slice().sort((a,b)=>d2(a.x,a.z)-d2(b.x,b.z));D.signs.forEach((L,i)=>{const p=sp[i];if(p&&on){L.position.set(p.x,p.y,p.z);L.color.copy(p.c)}else L.position.set(0,-50,0)})}
  D.lamps.forEach(L=>L.intensity=1.5*night);D.signs.forEach(L=>L.intensity=.9*night);
  D.cars.forEach((L,i)=>{const c=D.carList&&D.carList[i];if(!c||!on){L.intensity=0;L.position.set(0,-50,0);return}const r=c.r,d=c.dir,fx=r.axis==='x'?d:0,fz=r.axis==='x'?0:d,o=c.o.position;
    L.position.set(o.x+fx*(c.len/2+.1),.25,o.z+fz*(c.len/2+.1));L.target.position.set(o.x+fx*8,-.6,o.z+fz*8);L.intensity=2.2*night})}

let audioCtx=null,musicAudio=null,musicTrack=0;
const MUSIC_FILES=['audio/music-1.mp3','audio/music-2.mp3'];
function musicVolume(){return Number.isFinite(+OPT.musicVolume)?Math.max(0,Math.min(1,+OPT.musicVolume)):.2}
function startMusic(){
  if(OPT.music===false)return;
  if(!musicAudio){
    musicAudio=new Audio(MUSIC_FILES[musicTrack]);musicAudio.volume=musicVolume();
    musicAudio.addEventListener('ended',()=>{musicTrack=(musicTrack+1)%MUSIC_FILES.length;musicAudio.src=MUSIC_FILES[musicTrack];if(OPT.music!==false)musicAudio.play().catch(()=>{})});
  }
  if(musicAudio.paused)musicAudio.play().catch(()=>{});
}
function setMusic(on){OPT.music=on;saveOpt();if(on)startMusic();else if(musicAudio)musicAudio.pause()}
function setMusicVolume(v){OPT.musicVolume=Math.max(0,Math.min(1,+v));if(musicAudio)musicAudio.volume=OPT.musicVolume;saveOpt()}
function playSound(kind){
  if(OPT.sound===false)return;
  try{
    if(kind!=='money'){
      const sound=new Audio(kind==='close'?'audio/close.mp3':'audio/button.mp3');sound.volume=.5;sound.play().catch(()=>{});return;
    }
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;
    if(!audioCtx)audioCtx=new AudioContextClass();
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    const now=audioCtx.currentTime;
    [[1047,0,.12],[1319,.09,.13],[1568,.18,.25]].forEach(([freq,delay,duration])=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=now+delay;
      osc.type='sine';osc.frequency.setValueAtTime(freq,t);
      gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.065,t+.008);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.01);
    });
  }catch(e){}
}
document.addEventListener('click',ev=>{
  startMusic();
  const t=ev.target.closest&&ev.target.closest('button,input[type="button"],input[type="submit"],.mclk');

  const kind=('closePanel' in d||'mclose' in d||d.setgo==='resume'||d.tview==='menu'||/關閉|返回/.test(t.textContent))?'close':'click';

},true);
document.addEventListener('keydown',ev=>{
  if(ev.repeat||ev.target.closest&&ev.target.closest('input,textarea,select,button'))return;
  startMusic();

});

  openModal(`<div class="setm"><div class="seth"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg><b>設定</b><span class="pill">已暫停</span></div>
   <p class="eff">${s.scenName||''} · ${wkLabel()} · 現金 ${fmt(s.dispCash??s.cash)}。進度會自動儲存。</p>
   <div class="setl"><button class="btn pri" data-setgo="resume">繼續遊戲</button>
    ${s.shadow?'<button class="btn" data-setgo="shadow">睇隔籬：同規模傳統補習社<small style="display:block;font-weight:400;opacity:.75">工時、開支、顧客、口碑並排比較</small></button>':''}
    <button class="btn" data-setgo="menu">回到主選單</button>
    <div class="setsub"><button class="btn ghost" data-setgo="music">音樂：${OPT.music!==false?'開':'關'}</button><button class="btn ghost" data-setgo="sound">音效：${OPT.sound!==false?'開':'關'}</button><button class="btn ghost" data-setgo="lbl">3D 標籤：${W3.showLabels?'開':'關'}</button><button class="btn ghost" data-setgo="cam">重設視角</button></div><label>音樂音量 <input data-music-volume type="range" min="0" max="100" value="${Math.round(musicVolume()*100)}" aria-label="音樂音量"></label></div>
   <p class="eff" style="font-size:11.5px">主選單可以揀「繼續」返嚟呢局，或者開新一局。快捷鍵：Esc 開關設定，空白鍵暫停，1–4 轉速度。</p></div>`)}
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,input,.mclk');if(!t)return;
  const ds=t.dataset;
  if(t.closest('#title'))return;
  if(ds.speed!=null){if(s&&!s.over)setSpeed(+ds.speed);return}
  if(t.id==='setBtn'){if(s&&!s.over)showSettings();else showTitle('menu');return}
  if(ds.setgo){const g=ds.setgo;closeModal();if(g==='menu')return showTitle('menu');if(g==='music'){setMusic(OPT.music===false);return showSettings(true)}if(g==='sound'){OPT.sound=OPT.sound===false;saveOpt();if(OPT.sound)playSound('confirm');return showSettings(true)}if(g==='lbl'){toggleLabels();return showSettings(true)}if(g==='cam'){reset3DView();setSpeed(SET_PREV);return}if(g==='shadow')return enterShadow();setSpeed(SET_PREV);return}
  if(t.id==='v3reset')return reset3DView();
  if(t.id==='lblBtn')return toggleLabels();
  if(t.id==='extBtn')return setExterior(!W3.ext);
  if(ds.shexit!==undefined)return exitShadow();
  if(W3.viewShadow&&!t.closest('#shview')&&!t.closest('#demoCard'))return;
  if(ds.expand!==undefined)return expandRoom();
  if(ds.report!==undefined)return showReport();
  if(ds.feepol){const [k,v]=ds.feepol.split(':');return setFeePol(k,v==='true'?true:v==='false'?false:v)}
  if(ds.dataprep!==undefined)return dataPrep();
  if(ds.consent!==undefined)return consentDrive();
  if(ds.zoom!==undefined)return buyZoom();
  if(ds.lvsplit){realInit();const q=ds.lvsplit;s.lvSplit[q]=!s.lvSplit[q];log(s.lvSplit[q]?`「${GNAME[q]}」按程度分班：強弱分開，程度差距減半`:`「${GNAME[q]}」取消分程度`,'');save();render();return}
  if(ds.demonext!==undefined)return demoNext();
  if(ds.demoend!==undefined)return demoEnd();
  if(t.id==='floorBtn')return setFloor((W3.floor||1)===1?2:1);
  if(!s)return;
  if(ds.panel){if(ds.ptab)return openPanel(ds.panel,null,ds.ptab);return togglePanel(ds.panel)}
  if(ds.consult!==undefined)return setConsult(ds.consult==='1');
  if('closePanel' in ds)return closePanel();
  if(ds.up)return upgrade(ds.up);
  if(ds.down)return downgrade(ds.down);
  if(ds.wf){closeModal();return openPanel('ai',null,ds.wf)}
  if(ds.dept)return openPanel('dept',ds.dept);
  if(ds.hire)return hire(ds.hire);
  if(ds.fire)return fire(ds.fire);
  if(ds.share!=null)return setShare(+ds.share);
  if(ds.tier)return setTier(ds.tier);
  if(ds.ctog)return toggleCourse(ds.ctog);
  if(ds.recruit)return recruit(ds.recruit);
  if(ds.hirecand)return hireCand(+ds.hirecand);
  if(ds.firetutor)return fireTutor(+ds.firetutor);
  if(ds.move)return movePremise(ds.move);
  if(ds.fty!=null){PANEL.flt={ty:ds.fty||null};renderPanel();return}
  if(ds.fsj){const F=PANEL.flt||{};PANEL.flt={ty:F.ty,sj:F.sj===ds.fsj?null:ds.fsj};renderPanel();return}
  if('fclr' in ds){PANEL.flt={};renderPanel();return}
  if('cov' in ds){PANEL.cov=!PANEL.cov;renderPanel();return}
  if(ds.covg){const [c,g]=ds.covg.split('.');PANEL.flt={c,g};const G=s.courses[c].g[g];if(!G.cls&&!CMAP[c].summer){PANEL.form=freeForm(c,g);PANEL.sel={type:'new'}}else PANEL.sel=null;PANEL.tab='tt';PANEL.cov=false;renderPanel();pTop();return}
  if(ds.ttv){ttvShow(ds.ttv);return}
  if(ds.autoplan!==undefined){setAutoPlan(s.autoPlan===false);return}
  if(ds.stab){PANEL.tab=ds.stab;renderPanel();pTop();return}
  if(ds.ctab){if(!PANEL||PANEL.type!=='course')PANEL={type:'course'};PANEL.tab=ds.ctab;renderPanel();pTop();return}
  const parseSel=v=>{const [d,sl,r]=v.split(',');return {d:+d,sl:isNaN(+sl)?sl:+sl,r:+r}};
  const focusTti=()=>{requestAnimationFrame(()=>{const a=$('tti'),p=pScroll();if(a&&p&&innerWidth<1000)p.scrollTop=Math.max(0,a.offsetTop-8)})};
  if(ds.addcell){const {d,sl,r}=parseSel(ds.addcell);const f=Object.assign({},PANEL&&PANEL.form||{},{d,sl,r});
    let best=null,bw=-1;COURSES.forEach(C=>{if(C.daily||C.summer||!isPref(C.id,d,sl))return;let w=0;for(const k in s.courses[C.id].g)w+=s.courses[C.id].g[k].wait;if(s.courses[C.id].on)w+=.5;if(w>bw){bw=w;best=C.id}});
    if(best&&best!==f.c){f.c=best;f.g=null;f.tid=undefined}f.fromCell=true;const rc=classRecs({d,sl,r})[0];if(rc)Object.assign(f,{c:rc.c,g:rc.g,tid:rc.tid});PANEL.tab='tt';PANEL.form=f;PANEL.sel={type:'new',d,sl,r};renderPanel();focusTti();return}
  if(ds.selcls){if(!PANEL||PANEL.type!=='course')PANEL={type:'course'};PANEL.tab='tt';PANEL.sel=Object.assign({type:'cls'},parseSel(ds.selcls));PANEL.cut=null;renderPanel();focusTti();return}
  if('selx' in ds){PANEL.sel=null;PANEL.cut=null;renderPanel();return}
  if(ds.newfor){const id=ds.newfor;PANEL.tab='tt';PANEL.form=freeForm(id);PANEL.sel={type:'new'};renderPanel();pTop();return}
  if('dupcls' in ds){const e=selEntry(PANEL.sel);if(!e)return;const k=s.classes[e.ci];PANEL.form=freeForm(k.c,k.g,k.tid);PANEL.sel={type:'new'};renderPanel();focusTti();return}
  if('mvapply' in ds){const e=selEntry(PANEL.sel);if(e)moveClass(e.ci,PANEL.mv);return}
  if('cut' in ds){const e=selEntry(PANEL.sel);if(!e)return;const k=s.classes[e.ci];PANEL.cut=`${k.c}.${k.g}@${e.d},${e.sl},${e.r}`;renderPanel();return}
  if('cutno' in ds){PANEL.cut=null;renderPanel();return}
  if('cutok' in ds){const e=selEntry(PANEL.sel);if(e)reduceClass(e.ci);return}
  if(ds.gmaxx)return clearGmax(ds.gmaxx);
  if(ds.frng){PANEL.rng=ds.frng==='yr'||ds.frng==='all'?ds.frng:+ds.frng;renderPanel();return}
  if(ds.fmet){PANEL.met=ds.fmet;renderPanel();return}
  if(ds.vault){vaultInit();return vaultMove(ds.vault==='all'?s.vault:+ds.vault)}
  if(ds.loan){const [k,a]=ds.loan.split(':');return takeLoan(k,+a)}
  if(ds.repay)return repayLoan(+ds.repay);
  if(ds.rmfocus){const e=s.tt.find(x=>x.ci===+ds.rmfocus);if(e){PANEL={type:'course',tab:'tt',sel:{type:'cls',d:e.d,sl:e.sl,r:e.r}};renderPanel()}return}
  if(ds.rec!=null&&PANEL&&PANEL.recs){const x=PANEL.recs[+ds.rec];if(x){Object.assign(PANEL.form,{c:x.c,g:x.g,d:x.d,sl:x.sl,r:x.r,tid:x.tid});renderPanel()}return}
  if(ds.raise)return raiseTutor(+ds.raise);
  if('bossrest' in ds)return bossRest();
  if('teammeal' in ds)return teamMeal();
  if('bossleave' in ds)return leaveBoss();
  if(ds.leave)return leaveTutor(+ds.leave);
  if('influ' in ds)return inviteInfluencer();
  if(ds.seat!=null)return setSeat(+ds.seat);
  if('snack' in ds)return toggleSnack();
  if('sofa' in ds)return buySofa();
  if('tech' in ds)return upTech();
  if(ds.strat)return toggleStrat(ds.strat);
  if('edu' in ds)return toggleEdu();
  if(ds.month!=null){window.MPREV=speed;setSpeed(0);return showMonth(+ds.month)}
  if('mclose' in ds){closeModal();setSpeed(window.MPREV||0);return}
  if(ds.holpk){const [pk,v,key]=ds.holpk.split(':');const P=holPlanFor(key);P.on[pk]=clamp((P.on[pk]||0)+(+v),0,3);const hn=holNow();if(hn&&holKey(hn)===key){plan();holWeekRefresh()}save();renderPanel();return}
  if(ds.hsel){PANEL.hsel=ds.hsel;renderPanel();return}
  if(ds.holhire){const [pk,key]=ds.holhire.split(':');return recruitHol(pk,key)}
  if(ds.selhol!=null){PANEL.tab='tt';PANEL.sel={type:'hol',i:+ds.selhol};renderPanel();return}
  if('mkcls' in ds)return addManual(PANEL.form);
  if(ds.delcls)return delManual(+ds.delcls);
  if('next' in ds)return nextEvent();
  if(ds.wfm){const keep=$('modal').innerHTML;return showWF(ds.wfm,()=>{$('modal').innerHTML=keep;$('modal').className='modal'})}
});
document.addEventListener('dragstart',ev=>{const b=ev.target.closest&&ev.target.closest('[data-drag]');if(!b||!s)return;DRAG={ci:+b.dataset.drag};ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',b.dataset.drag)}catch(e){}
  b.classList.add('dragging');requestAnimationFrame(()=>dragTargets(DRAG.ci))});
document.addEventListener('dragover',ev=>{if(!DRAG)return;{const sv=ev.target.closest&&ev.target.closest('[data-ttv]');if(sv&&PANEL.ttv!==sv.dataset.ttv){ttvShow(sv.dataset.ttv)}}const b=ev.target.closest&&ev.target.closest('[data-addcell],[data-drag]');document.querySelectorAll('.dover').forEach(x=>{if(x!==b)x.classList.remove('dover')});if(b&&!b.classList.contains('dbad')){ev.preventDefault();ev.dataTransfer.dropEffect='move';b.classList.add('dover')}});
document.addEventListener('drop',ev=>{if(!DRAG)return;const b=ev.target.closest&&ev.target.closest('[data-addcell],[data-drag]');ev.preventDefault();const ci=DRAG.ci;DRAG=null;dragClear();
  if(!b)return;if(b.classList.contains('dbad')){toast(b.dataset.why||'調唔到');return}if(b.dataset.drag!=null){if(+b.dataset.drag!==ci)swapClasses(ci,+b.dataset.drag);return}const [d,sl,r]=b.dataset.addcell.split(',').map(Number),k=s.classes[ci];if(!k)return;moveClass(ci,{d,sl,r,tid:k.tid})});
document.addEventListener('dragend',()=>{if(DRAG){DRAG=null;dragClear();renderPanel()}});
document.addEventListener('mouseover',ev=>{if(!DRAG)return;const b=ev.target.closest&&ev.target.closest('[data-addcell]');if(b&&b.dataset.why)b.title=b.dataset.why});
document.addEventListener('mousemove',ev=>{const g=ev.target.closest&&ev.target.closest('.fhit'),box=ev.target.closest&&ev.target.closest('.fchart');document.querySelectorAll('.ftip').forEach(tp=>{if(!box||!g||!box.contains(tp)){tp.hidden=true;return}const r=box.getBoundingClientRect();tp.hidden=false;tp.textContent=g.dataset.tip;tp.style.left=Math.min(r.width-tp.offsetWidth-4,Math.max(4,ev.clientX-r.left+10))+'px';tp.style.top=Math.max(0,ev.clientY-r.top-34)+'px'});document.querySelectorAll('.fhit.on').forEach(x=>{if(x!==g)x.classList.remove('on')});if(g)g.classList.add('on')});
document.addEventListener('input',ev=>{if(ev.target.matches('[data-music-volume]'))setMusicVolume(+ev.target.value/100)});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.rev)return setReview(t.dataset.rev,t.checked);if(t.dataset&&t.dataset.vauto!==undefined){s.vaultAuto=t.checked;log(t.checked?'開咗「現金唔夠自動由小金庫補」':'熄咗「現金唔夠自動由小金庫補」','');save();render();return}
  if(t.dataset&&t.dataset.nf&&PANEL){const f=PANEL.form=PANEL.form||{},k=t.dataset.nf,v=t.value;
    if(k==='c'){f.c=v;f.g=null;f.tid=undefined}else if(k==='g')f.g=v;else if(k==='tid')f.tid=+v;else if(k==='r')f.r=+v;else if(k==='cell'){const [d,sl]=v.split('-').map(Number);f.d=d;f.sl=sl}
    t.blur();renderPanel();return}
  if(t.dataset&&t.dataset.mv&&PANEL&&PANEL.mv){const m=PANEL.mv,k=t.dataset.mv,v=t.value;
    if(k==='cell'){const [d,sl]=v.split('-').map(Number);m.d=d;m.sl=sl}else if(k==='r')m.r=+v;else if(k==='tid')m.tid=+v;
    t.blur();renderPanel()}});
document.addEventListener('keydown',ev=>{
  if(ev.target.closest&&ev.target.closest('input,textarea'))return;
  if(ev.key==='Escape'&&W3.viewShadow){exitShadow();return}
  if(ev.key==='Escape'){if(!$('mw').hidden&&!busy&&s){const set=$('modal').querySelector('[data-setgo]');closeModal();if(set)setSpeed(SET_PREV)}else if(PANEL)closePanel();else if(s&&!s.over&&!titleOn&&$('mw').hidden)showSettings();return}
  if(!s||s.over||!$('mw').hidden||titleOn)return;
  if(ev.key===' '){ev.preventDefault();setSpeed(speed?0:lastSpeed)}
  else if(ev.key>='1'&&ev.key<='4')setSpeed(SPEEDS[+ev.key]);
});
let toastT=null;
function toast(msg){const el=$('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,3200)}
function save(){if(W3.viewShadow)return;try{localStorage.setItem('aibx-save4',JSON.stringify(s))}catch(e){}}

function start(data){
  init3D();
  requestAnimationFrame(clockLoop);
  $('lblBtn').classList.toggle('on',W3.showLabels);
  if(data&&data.s){s=migrate(data.s);if(W3.ok)setEnv(s.env);render();setSpeed(data.speed||0);if(s.over)showEnd(s.cash<-80000);return}
  newGame(SCENARIOS[0]);render();setSpeed(0);showStart();
}
window.claude?.hot?.snapshot?.(()=>({s,speed}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
